<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7fc"><title>Call Tracker</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#35354a;background:#f8f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px 14px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:4px 0 14px;font-size:27px}h2{font-size:19px}.muted{color:#77768a;font-size:13px}.tabs,.days{display:flex;gap:7px;overflow:auto;padding:6px 0 12px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 13px;background:#eae5f7;color:#55477c;font-weight:650}.tabs button.active,.days button.active{background:#8170ad;color:white}.panel,.item{background:white;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 2px 12px #27213a08}.item.ku{border-left:5px solid #9dcce7}.item.repeat{border-left:5px solid #f1d78b}.item.late{border-left:5px solid #e5a1a8}.item.soon{border-left:5px solid #efd68d}.item.ok{border-left:5px solid #b6dcc6}.item.urgent{background:#ffe0e3;border:1px solid #e998a3;border-left:6px solid #d94c61}.item.ku-orange{background:#fff0dc;border-left:6px solid #e89b36}.item.ku-red{background:#ffe1e4;border-left:6px solid #d94c61}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.good{background:#dcf2e6;color:#286b4b}.warn{background:#fff0ca;color:#86631b}.bad{background:#fae1e4;color:#a44351}.primary{background:#dceaf9;color:#37658f}.tiny{font-size:12px;padding:7px 9px}label{display:block;font-size:13px;margin:12px 0 5px;color:#676478}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd9e7;border-radius:10px;background:#fff;color:#343449}textarea{min-height:88px;resize:vertical}.pill{font-size:12px;border-radius:9px;padding:5px 8px;background:#f0eafa;color:#735b9a}.empty{text-align:center;color:#8c889a;padding:35px 10px}.hide{display:none}.ku-slot{background:#edf6fc;border:1px dashed #b9d6e9;border-radius:12px;padding:11px;margin:8px 0;color:#5b86a6}.right{display:flex;gap:6px;align-items:center}.count{background:#e9e3f4;padding:5px 9px;border-radius:10px}.small{font-size:12px}details summary{cursor:pointer;color:#7965a4;margin-top:12px}.module{background:#fff;border-radius:14px;padding:12px 15px;margin:8px 0 20px;border:1px solid #e5dfed}.module summary{font-weight:700}.module textarea{margin-top:8px}.report{width:100%;border-collapse:collapse;font-size:12px}.report td,.report th{padding:8px 4px;border-bottom:1px solid #eee;text-align:center}.report td:first-child,.report th:first-child{text-align:left}.stats{display:flex;gap:9px;flex-wrap:wrap}.stats span{background:#f0eafa;border-radius:10px;padding:9px}.item .topic{font-size:13px;margin-top:7px;color:#555}footer{color:#8c8999;font-size:11px;margin-top:25px} @media print{body{background:white!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important;font:14px Arial,sans-serif;color:#222}#printArea h1{font-size:23px}#printArea table{width:100%;border-collapse:collapse}#printArea th,#printArea td{border:1px solid #aaa;padding:9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}#printArea th{background:#eee}#printArea tr{break-inside:avoid}@page{size:A4;margin:15mm}}
</style></head><body><div class="wrap"><header><div><div class="muted">МОЙ РАБОЧИЙ ПОМОЩНИК</div><h1>Call Tracker</h1></div><button class="no-print" onclick="openAdd()">+ Добавить</button></header><nav class="tabs no-print"><button data-tab="calls" class="active" onclick="tab('calls')">Звонки</button><button data-tab="ku" onclick="tab('ku')">КУ звонки</button><button data-tab="visits" onclick="tab('visits')">Ожидаем в отделении</button></nav><main id="app"></main><footer>Данные хранятся только в этом браузере. Не вводите конфиденциальную банковскую информацию. При очистке данных браузера записи могут исчезнуть.</footer></div><section id="printArea" hidden></section><dialog id="modal" style="border:0;border-radius:18px;width:min(94vw,460px);padding:22px;box-shadow:0 15px 60px #2224"><form id="form"><h2>Добавить клиента</h2><label>Фамилия</label><input id="surname" maxlength="100" required autocomplete="off"><label>Категория</label><select id="category"><option value="КУ">КУ</option><option value="КЕШ">КЕШ</option><option value="Восстановление / другие">Восстановление связи</option><option value="Другие звонки">Другие звонки</option><option value="Привет">Привет</option></select><div id="topicWrap" style="display:none"><label>Тема звонка</label><input id="topic" maxlength="180"></div><div id="dateWrap"><label>Закрыть звонок до</label><input type="date" id="due"></div><div class="actions"><button type="submit" class="good">Сохранить</button><button type="button" onclick="modal.close()">Отмена</button></div></form></dialog><script>
const KEY='calltracker_v1';let data=[];try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))data=x}catch(e){}
const MODULE_KEY='calltracker_modules_v2';let modules={};try{modules=JSON.parse(localStorage.getItem(MODULE_KEY)||'{}')||{}}catch(e){}
let current='calls',day=Math.min(4,(new Date().getDay()+6)%7);const names=['Понедельник','Вторник','Среда','Четверг','Пятница'];const cats=['КУ','КЕШ','Восстановление / другие','Привет','Другие звонки'];const labels={'КУ':'Новые КУ','КЕШ':'КЕШ','Восстановление / другие':'Восстановление связи','Привет':'Привет','Другие звонки':'Другие звонки'};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const iso=(d=new Date())=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const monday=(date=iso())=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};const plusDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const weekEnd=w=>plusDays(w,4);const isLong=c=>c.category==='КУ'||c.category==='Другие звонки';
function normalize(){let changed=false;for(let c of data){if(c.category==='Другие')c.category='Другие звонки';if(c.attempt==null)c.attempt=0;if(!c.status)c.status='active';if(!c.created)c.created=iso();if(!c.week)c.week=monday(c.created);if(!c.events)c.events=[];if(!c.topic)c.topic='';if(!c.notes)c.notes='';if(c.day==null)c.day=0;if(c.status==='active'&&c.due&&c.due<iso()&&isLong(c)){c.status='expired';c.closed=plusDays(c.due,1);changed=true}if(c.status==='active'&&!isLong(c)&&weekEnd(c.week)<iso()){c.status='expired';c.closed=plusDays(weekEnd(c.week),1);changed=true}}if(changed)localStorage.setItem(KEY,JSON.stringify(data))}normalize();
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function tab(t){current=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function formFields(){let cat=$('category').value; $('dateWrap').style.display=isLong({category:cat})?'block':'none';$('topicWrap').style.display=cat==='Другие звонки'?'block':'none';$('due').required=cat==='Другие звонки'}
function openAdd(){ $('form').reset();$('category').value=day===0?'КЕШ':day===1?'Восстановление / другие':day===2?'Привет':'КУ';formFields();$('modal').showModal()}$('category').onchange=formFields;
$('form').onsubmit=e=>{e.preventDefault();let cat=$('category').value,name=$('surname').value.trim();if(!name)return;let obj={id:uid(),name,category:cat,attempt:0,status:'active',created:iso(),week:monday(),notes:'',topic:$('topic').value.trim(),due:isLong({category:cat})?$('due').value:'',day:cat==='КЕШ'?0:cat==='Восстановление / другие'?1:cat==='Привет'?2:day,events:[]};data.push(obj);$('modal').close();save()};
function act(id,action){let c=data.find(x=>x.id===id);if(!c)return;let now=iso();if(action==='visit'){c.status='visit';c.closed=now;c.events.push({date:now,type:'plus'})}else if(action==='arrived'){c.status='arrived'}else if(action==='reached'){c.status='plus';c.closed=now;c.events.push({date:now,type:'plus'})}else if(action==='retry'){if(c.status!=='active')return;c.attempt++;c.events.push({date:now,type:'attempt'});if(c.attempt>=3){c.status='minus';c.closed=now}}save()}
function update(id,field,val){let c=data.find(x=>x.id===id);if(!c)return;c[field]=val;localStorage.setItem(KEY,JSON.stringify(data))}function changeAndRender(id,field,val){update(id,field,val);normalize();render()}function remove(id){if(confirm('Удалить контакт?')){data=data.filter(x=>x.id!==id);save()}}
function sortKU(a,b){return (a.due||'9999').localeCompare(b.due||'9999')||a.name.localeCompare(b.name,'ru')}
function card(c,urgent=false){let long=isLong(c),visit=c.status==='visit';let daysLeft=c.due?Math.round((new Date(c.due+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000):null;let style=urgent?'urgent':long&&daysLeft!==null&&daysLeft<=2?'ku-red':long&&daysLeft===3?'ku-orange':long?'ku':c.attempt?'repeat':'';let html=`<article class="item ${style}">${urgent?'<div style="font-weight:700;color:#b4233b;margin-bottom:8px">СРОЧНО · прозвонить</div>':''}<div class="line"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(labels[c.category]||c.category)} · Попыток: ${c.attempt} из 3</div></div>${long&&c.due?`<span class="pill">До ${esc(c.due.split('-').reverse().join('.'))}</span>`:''}</div>${c.topic?`<div class="topic">Тема: ${esc(c.topic)}</div>`:''}`;
if(long){html+=`<details><summary>Комментарий${c.category==='Другие звонки'?', тема':''} и срок</summary><label>Комментарий</label><textarea oninput="update('${c.id}','notes',this.value)">${esc(c.notes)}</textarea>${c.category==='Другие звонки'?`<label>Тема звонка</label><input value="${esc(c.topic)}" onchange="changeAndRender('${c.id}','topic',this.value)">`:''}<label>Закрыть звонок до</label><input type="date" value="${esc(c.due)}" onchange="changeAndRender('${c.id}','due',this.value)"></details>`}
if(visit){html+=`<div class="muted" style="white-space:pre-wrap;margin-top:8px">${esc(c.notes)}</div><div class="actions no-print"><button class="good" onclick="act('${c.id}','arrived')">Пришёл</button><button class="tiny bad" onclick="remove('${c.id}')">Удалить</button></div>`}else{html+=`<div class="actions no-print"><button class="good" onclick="act('${c.id}','reached')">Дозвон</button><button class="warn" onclick="act('${c.id}','retry')">Не дозвон · попытка</button>${c.category==='КУ'?`<button class="primary" onclick="act('${c.id}','visit')">Согласился прийти</button>`:''}<button class="tiny bad" onclick="remove('${c.id}')">×</button></div>`}return html+'</article>'}
const defaultModule={ 'КУ':'Початок: Добрий день! Мене звати ..., я спеціаліст ПриватБанку. Чи зручно вам зараз розмовляти?\nМета: коротко пояснити причину дзвінка та уточнити можливість отримання картки.\nЗаперечення «Немає часу»: Коли вам буде зручно передзвонити?\nЗавершення: Дякую за розмову!', 'КЕШ':'Початок: Добрий день! Чи зручно вам розмовляти?\nОсновна частина: пояснити мету звернення та актуальні умови лише за затвердженими матеріалами банку.\nЗаперечення «Не цікаво»: Розумію. Чи можу коротко уточнити причину?\nЗавершення: Дякую за ваш час.', 'Восстановление / другие':'Початок: Добрий день! Чи зручно вам зараз розмовляти?\nМета: уточнити, чи потрібна допомога з банківським обслуговуванням.\nЗаперечення «Немає часу»: Коли вам буде зручно?\nЗавершення: Дякую!', 'Привет':'Початок: Добрий день! Мене звати ..., я спеціаліст ПриватБанку.\nМета: коротко розповісти про можливості послуги «Привіт» згідно з чинними матеріалами банку.\nЗаперечення «Не потрібно»: Розумію, дякую за відповідь.\nЗавершення: Гарного дня!', 'Другие звонки':'Початок: Добрий день! Чи зручно вам розмовляти?\nМета: пояснити тему дзвінка.\nЗаперечення «Немає часу»: Коли зручно передзвонити?\nЗавершення: Дякую за розмову.'};
function saveModule(cat,val){modules[cat]=val;localStorage.setItem(MODULE_KEY,JSON.stringify(modules))}function moduleView(cat){return `<details class="module"><summary>Речевой модуль и возражения · ${esc(labels[cat])}</summary><div class="muted" style="margin-top:8px">Редактируемый шаблон. Не является утверждённым скриптом банка.</div><textarea style="min-height:190px" oninput="saveModule('${cat}',this.value)">${esc(modules[cat]??defaultModule[cat])}</textarea></details>`}
function visible(c,d,w){if(c.status!=='active')return false;if(c.created>plusDays(w,d))return false;if(c.due&&c.due<plusDays(w,d))return false;if(c.week>w)return false;if(!isLong(c)&&c.week!==w)return false;if(d<=2){if(c.category==='КУ'||c.category==='Другие звонки')return c.day===d||(c.week<w&&d===0);return c.day===d}return true}
function urgent(c,d){return d===3?c.attempt===0:d===4?c.attempt<2:false}
function report(w){let until=weekEnd(w);let rows=cats.map(cat=>{let list=data.filter(c=>c.category===cat&&c.created<=until&&(c.week<=w));let was=list.filter(c=>c.created<w&&isLong(c)&&(!c.closed||c.closed>=w)).length;let newer=list.filter(c=>c.created>=w&&c.created<=until).length;let plus=list.filter(c=>(c.status==='plus'||c.status==='visit'||c.status==='arrived')&&c.closed>=w&&c.closed<=until).length;let minus=list.filter(c=>c.status==='minus'&&c.closed>=w&&c.closed<=until).length;let remain=list.filter(c=>((c.status==='active'&&(!c.closed||c.closed>until))||(c.status==='expired'&&c.closed> w&&c.closed<=plusDays(until,1)))&&((c.created>=w&&c.created<=until)||(isLong(c)&&c.created<w))).length;return {cat,was,newer,plus,minus,remain}});return rows}
function reportView(w){let rows=report(w),sum=k=>rows.reduce((a,r)=>a+r[k],0);let body=rows.map(r=>`<tr><td>${esc(labels[r.cat])}</td><td>${r.was}</td><td>${r.newer}</td><td>${r.plus}</td><td>${r.minus}</td><td>${r.remain}</td></tr>`).join('');return `<div class="panel"><h2>Итоги недели · ${esc(w)} — ${weekEnd(w)}</h2><div style="overflow-x:auto"><table class="report"><thead><tr><th>Группа</th><th>Было</th><th>Новые</th><th>+</th><th>−</th><th>Ост.</th></tr></thead><tbody>${body}<tr><th>Итого</th>${['was','newer','plus','minus','remain'].map(k=>`<th>${sum(k)}</th>`).join('')}</tr></tbody></table></div><div class="actions"><button onclick="copyReport('${w}')">Копировать отчёт</button><button onclick="downloadReport('${w}')">Скачать CSV</button></div></div>`}
function reportText(w){let rows=report(w);return ['Неделя '+w+' — '+weekEnd(w),'Группа;Было;Новые;Отработано+;Отработано-;Остаток',...rows.map(r=>[labels[r.cat],r.was,r.newer,r.plus,r.minus,r.remain].join(';'))].join('\n')}
function copyReport(w){let t=reportText(w);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('Отчёт скопирован')).catch(()=>prompt('Скопируйте отчёт',t));else prompt('Скопируйте отчёт',t)}function downloadReport(w){let blob=new Blob(['\ufeff'+reportText(w)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Звонки_'+w+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function render(){normalize();let el=$('app'),html='',w=monday();if(current==='visits'){let list=data.filter(c=>c.status==='visit');html=`<div class="panel line"><div><h2>Ожидаем в отделении</h2><div class="muted">Клиентов: ${list.length}</div></div><button class="no-print" onclick="exportWord()">Скачать список Word</button></div>`+(list.length?list.map(card).join(''):'<div class="empty">Пока нет ожидаемых посещений</div>')}else if(current==='ku'){let list=data.filter(c=>c.category==='КУ'&&c.status==='active'&&c.attempt>=1).sort(sortKU);html=`<div class="panel"><h2>КУ звонки</h2><div class="muted">Повторные попытки: ${list.length}</div></div>`+(list.length?list.map(card).join(''):'<div class="empty">Пока нет повторных звонков КУ</div>')}else{html='<div class="days">'+names.map((n,i)=>`<button class="${day===i?'active':''}" onclick="day=${i};render()">${n}</button>`).join('')+'</div>';let active=data.filter(c=>visible(c,day,w)),closed=data.filter(c=>c.closed===plusDays(w,day)&&['plus','minus','visit','arrived'].includes(c.status));html+=`<div class="panel"><h2>${names[day]}</h2><div class="stats"><span><b>${active.length}</b> надо сделать</span><span><b>${closed.filter(c=>c.status!=='minus').length}</b> +</span><span><b>${closed.filter(c=>c.status==='minus').length}</b> −</span></div></div>`;for(let cat of cats){if(day<=2&&!['КУ','Другие звонки',day===0?'КЕШ':day===1?'Восстановление / другие':'Привет'].includes(cat))continue;let list=active.filter(c=>c.category===cat).sort((a,b)=>Number(urgent(b,day))-Number(urgent(a,day))||sortKU(a,b));html+=`<h2>${esc(labels[cat])} <span class="pill">${list.length}</span></h2>`;if(cat==='КУ'&&day<=2){for(let i=0;i<3;i++)html+=list[i]?card(list[i]):`<div class="ku-slot">КУ · свободное место ${i+1}</div>`;html+=list.slice(3).map(c=>card(c)).join('')}else html+=list.length?list.map(c=>card(c,urgent(c,day))).join(''):'<div class="empty" style="padding:12px">Нет активных звонков</div>';html+=moduleView(cat)}if(day===4)html+=reportView(w);html+=`<details class="panel"><summary>История недельных отчётов</summary><label>Выберите понедельник недели</label><input type="date" id="reportDate" value="${w}" onchange="$('historyReport').innerHTML=reportView(monday(this.value))"><div id="historyReport"></div></details>`}el.innerHTML=html}
function exportWord(){
 const list=data.filter(c=>c.status==='visit');
 const xmlEscape=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const para=(v,bold=false)=>'<w:p><w:r>'+(bold?'<w:rPr><w:b/></w:rPr>':'')+'<w:t xml:space="preserve">'+xmlEscape(v)+'</w:t></w:r></w:p>';
 const cell=v=>'<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>'+String(v).split(/\r?\n/).map(t=>para(t)).join('')+'</w:tc>';
 const row=a=>'<w:tr>'+a.map(cell).join('')+'</w:tr>';
 const table='<w:tbl><w:tblPr><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(x=>'<w:'+x+' w:val="single" w:sz="5" w:color="C6C6C6"/>').join('')+'</w:tblBorders></w:tblPr>'+row(['№','Фамилия','Комментарий'])+list.map((c,i)=>row([i+1,c.name,c.notes||''])).join('')+'</w:tbl>';
 const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+para('Ожидаем в отделении',true)+para('Дата формирования: '+new Date().toLocaleDateString('ru-RU')+' · Клиентов: '+list.length)+table+'<w:sectPr/></w:body></w:document>';
 const files=[
 ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
 ['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
 ['word/document.xml',documentXml]
 ];
 const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
 const u16=(v)=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
 function crc32(bytes){let c=0xFFFFFFFF;for(let b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return(c^0xFFFFFFFF)>>>0}
 function add(arr){let a=new Uint8Array(arr);chunks.push(a);offset+=a.length}
 for(const [name,content] of files){
   let n=enc.encode(name),d=enc.encode(content),crc=crc32(d),start=offset;

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7e9fb"><title>Мой рабочий день</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#273047;background:#f5f6fc}*{box-sizing:border-box}body{margin:0}header{background:#e7e9fb;padding:23px 18px 15px}h1{font-size:24px;margin:0 0 14px}nav{display:flex;gap:7px}nav button{flex:1}button,select,input{font:inherit;border:1px solid #d5d9ed;border-radius:12px;padding:12px;background:white;color:#29324d}button{cursor:pointer}.active,.primary{background:#6568ba;color:white;border-color:#6568ba}main{max-width:680px;margin:auto;padding:16px}.panel{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #30376a0b}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:16px 0 9px}.line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:11px 0}.line label{flex:1;min-width:140px}.line select,.line input{flex:1;min-width:130px;max-width:100%}.full{width:100%}.muted{color:#69718a;font-size:13px}.hidden{display:none!important}.item{border-bottom:1px solid #eef0f8;padding:11px 0}.item:last-child{border:0}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #eef0f8;padding:12px 0}.stat strong{font-size:19px}.danger{color:#b33f58}.small{font-size:13px;padding:7px 10px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{background:#f3f3fc;padding:9px;border-radius:10px}.notice{background:#fff4e0;padding:11px;border-radius:10px;font-size:13px;margin:12px 0}</style></head><body><header><h1>Мой рабочий день</h1><nav><button class="active" data-tab="clients">Клиенты</button><button data-tab="report">Отчёт</button><button data-tab="cards">Выданные карты</button></nav></header><main><section id="clients"><div class="panel"><h2>Новый клиент</h2><div class="line"><label for="age">Возраст</label><select id="age"><option value="child">До 18 лет</option><option value="adult">От 18 до 65 лет</option><option value="senior">Старше 65 лет</option></select></div><div id="fields"></div><button class="primary full" id="save">Сохранить клиента</button><p class="muted">Один клиент учитывается один раз, независимо от числа операций.</p></div><div class="panel"><h2>Клиенты за сегодня</h2><div id="todayList"></div></div></section><section id="report" class="hidden"><div class="panel"><h2>Отчёт за день</h2><div class="line"><label for="reportDate">Дата</label><input type="date" id="reportDate"></div><div id="stats"></div><button class="primary full" id="exportReport">Скачать отчёт CSV</button></div></section><section id="cards" class="hidden"><div class="panel"><h2>Журнал выданных карт</h2><p class="muted">Новые Универсальные и карты КАТКА с датой и ID клиента.</p><div id="cardsList"></div><button class="primary full" id="exportCards">Скачать журнал CSV</button></div></section></main><script>
const $=s=>document.querySelector(s), STORE='workday_clients_v1';let records=[];try{records=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('#reportDate').value=today();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function select(id,label,opts){return `<div class="line"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}const yn=[['','Выбрать'],['yes','Да'],['no','Нет']];const ops=[['','Выбрать'],['new','Новая карта'],['reissue','Перевыпуск'],['update','Обновление данных']];function credit(prefix){return `<div class="panel" style="background:#f7f7fe"><h3>Кредитный лимит</h3>${select(prefix+'Apply','Заявка на лимит',yn)}<div id="${prefix}ReasonWrap" class="hidden"><div class="line"><label>Причина отсутствия заявки</label><input id="${prefix}Reason" placeholder="Укажите причину"></div></div><div id="${prefix}ApprovedWrap" class="hidden">${select(prefix+'Approved','Лимит одобрен',yn)}</div></div>`}function drawFields(){let a=$('#age').value;$('#fields').innerHTML=a==='child'?`${select('junior','Юниор',ops)}${select('student','Студент KDV',ops)}<div class="line"><label><input type="checkbox" id="katka"> Выдана карта КАТКА</label></div><div id="katkaIdWrap" class="hidden"><div class="line"><label>ID клиента КАТКА</label><input id="katkaId" placeholder="ID клиента"></div></div>`:a==='adult'?`${select('ku','Карта Универсальная',[['','Не выбрано'],['new','Новая КУ'],['old','Старая КУ'],['reissue','Перевыпуск КУ'],['refusal','Отказ от КУ']])}<div id="kuIdWrap" class="hidden"><div class="line"><label>ID клиента новой КУ</label><input id="kuId" placeholder="ID клиента"></div></div><div id="refusalWrap" class="hidden"><div class="line"><label>Причина отказа от КУ</label><input id="refusalReason" placeholder="Укажите причину"></div></div><div id="creditWrap" class="hidden">${credit('cr')}</div>${select('privet','Привет',yn)}${select('insurance','Страховка',yn)}<div id="pointsWrap" class="hidden"><div class="line"><label>Баллы за страховку</label><input type="number" min="0" step="0.01" id="points" placeholder="0"></div></div>`:`${select('oldKu','Есть старая КУ',yn)}<div id="creditWrap" class="hidden">${credit('cr')}</div>${select('privet','Привет',yn)}${select('insurance','Страховка',yn)}<div id="pointsWrap" class="hidden"><div class="line"><label>Баллы за страховку</label><input type="number" min="0" step="0.01" id="points" placeholder="0"></div></div>`;updateConditional()}function val(id){return $('#'+id)?.value||''}function show(id,yes){let el=$('#'+id);if(el)el.classList.toggle('hidden',!yes)}function updateConditional(){let a=val('age');if(a==='child')show('katkaIdWrap',$('#katka')?.checked);else{let eligible=a==='adult'?['new','old','reissue'].includes(val('ku')):val('oldKu')==='yes';show('creditWrap',eligible);show('kuIdWrap',a==='adult'&&val('ku')==='new');show('refusalWrap',a==='adult'&&val('ku')==='refusal');show('pointsWrap',val('insurance')==='yes');show('crReasonWrap',eligible&&val('crApply')==='no');show('crApprovedWrap',eligible&&val('crApply')==='yes')}}$('#age').addEventListener('change',drawFields);$('#fields').addEventListener('change',updateConditional);drawFields();function saveData(){try{localStorage.setItem(STORE,JSON.stringify(records));return true}catch(e){alert('Не удалось сохранить данные. Проверьте свободное место в браузере.');return false}}$('#save').onclick=()=>{let age=val('age'),r={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),date:today(),age};if(age==='child'){r.junior=val('junior');r.student=val('student');r.katka=$('#katka').checked;r.katkaId=val('katkaId').trim();if(r.katka&&!r.katkaId)return alert('Укажите ID клиента для карты КАТКА')}else{r.ku=age==='adult'?val('ku'):(val('oldKu')==='yes'?'old':'');r.oldKu=val('oldKu');r.kuId=val('kuId').trim();r.refusalReason=val('refusalReason').trim();let eligible=age==='adult'?['new','old','reissue'].includes(r.ku):r.oldKu==='yes';r.apply=eligible?val('crApply'):'';r.approved=r.apply==='yes'?val('crApproved'):'';r.noApplyReason=r.apply==='no'?val('crReason').trim():'';r.privet=val('privet');r.insurance=val('insurance');r.points=r.insurance==='yes'?Number(val('points')):0;if(age==='adult'&&r.ku==='new'&&!r.kuId)return alert('Укажите ID клиента для новой КУ');if(r.ku==='refusal'&&!r.refusalReason)return alert('Укажите причину отказа');if(r.apply==='no'&&!r.noApplyReason)return alert('Укажите причину отсутствия заявки');if(r.apply==='yes'&&!r.approved)return alert('Укажите, одобрен ли лимит');if(r.insurance==='yes'&&(val('points')===''||!Number.isFinite(r.points)||r.points<0))return alert('Укажите количество баллов за страховку')}records.push(r);if(!saveData()){records.pop();return}drawFields();render();alert('Клиент сохранён')};function remove(id){if(!confirm('Удалить запись клиента?'))return;records=records.filter(r=>r.id!==id);saveData();render()}function stats(date){let a=records.filter(r=>r.date===date);return [['Количество человек за день',a.length],['Количество клиентов от 18 до 65 лет',a.filter(r=>r.age==='adult').length],['Отказались от новой КУ',a.filter(r=>r.age==='adult'&&r.ku==='refusal').length],['Выдано новых КУ',a.filter(r=>r.ku==='new').length],['Выдано карт КАТКА',a.filter(r=>r.katka).length],['Выдано карт ЮНИОР',a.filter(r=>r.junior==='new').length],['Перевыпуск КУ',a.filter(r=>r.ku==='reissue').length],['Из них с одобренным лимитом',a.filter(r=>r.ku==='reissue'&&r.approved==='yes').length],['Заявок на кредитный лимит',a.filter(r=>r.apply==='yes').length],['Из них одобрено',a.filter(r=>r.apply==='yes'&&r.approved==='yes').length],['Баллы за страховки',Number(a.reduce((s,r)=>s+(Number(r.points)||0),0).toFixed(2))]]}function refusalRows(date){return records.filter(r=>r.date===date&&r.age==='adult'&&r.ku==='refusal')}function render(){let t=records.filter(r=>r.date===today());$('#todayList').innerHTML=t.length?t.map(r=>`<div class="item"><strong>${r.age==='child'?'До 18':r.age==='adult'?'18–65':'65+'}</strong> · ${safe([r.ku&&'КУ: '+r.ku,r.junior&&'Юниор: '+r.junior,r.student&&'Студент: '+r.student,r.katka&&'КАТКА',r.apply==='yes'&&'Заявка на лимит',r.insurance==='yes'&&'Страховка'].filter(Boolean).join(', ')||'Обслуживание')} <button class="small danger" data-remove="${r.id}">Удалить</button></div>`).join(''):'<p class="muted">Пока нет записей.</p>';$('#stats').innerHTML=stats(val('reportDate')).map(([k,v])=>`<div class="stat"><span>${k}</span><strong>${v}</strong></div>`).join('')+`<h3>Отказы от новой КУ — причины</h3>`+(refusalRows(val('reportDate')).length?refusalRows(val('reportDate')).map((r,i)=>`<div class="item"><strong>${i+1}.</strong> ${safe(r.refusalReason||'Причина не указана')}</div>`).join(''):'<p class="muted">Отказов не зафиксировано.</p>');let cards=records.flatMap(r=>[...(r.ku==='new'?[{type:'Новая КУ',id:r.kuId,date:r.date,rec:r.id}]:[]),...(r.katka?[{type:'КАТКА',id:r.katkaId,date:r.date,rec:r.id}]:[])]).reverse();$('#cardsList').innerHTML=cards.length?cards.map(c=>`<div class="item"><strong>${c.type}</strong><div>ID: ${safe(c.id)}</div><span class="muted">${c.date}</span> <button class="small danger" data-remove="${c.rec}">Удалить запись</button></div>`).join(''):'<p class="muted">Нет выданных карт.</p>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-remove]');if(b)remove(b.dataset.remove)});$('#reportDate').addEventListener('change',render);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['clients','report','cards'].forEach(t=>$('#'+t).classList.toggle('hidden',t!==b.dataset.tab));render()});function csv(rows,name){let s='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('#exportReport').onclick=()=>csv([['Показатель','Значение'],...stats(val('reportDate')),[],['Отказы от новой КУ','Причина'],...refusalRows(val('reportDate')).map((r,i)=>[i+1,r.refusalReason||'Причина не указана'])],'otchet_'+val('reportDate')+'.csv');$('#exportCards').onclick=()=>csv([['Дата выдачи','Тип карты','ID клиента'],...records.flatMap(r=>[...(r.ku==='new'?[[r.date,'Новая КУ',r.kuId]]:[]),...(r.katka?[[r.date,'КАТКА',r.katkaId]]:[])])],'vydannye_karty.csv');render();</script></body></html>
